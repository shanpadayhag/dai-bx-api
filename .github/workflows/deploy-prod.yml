name: Deploy prod

on:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  AWS_REGION: ap-southeast-1
  FUNCTION_NAME: daibx-api-prod
  SCHEDULER_FUNCTION_NAME: daibx-scheduler-prod
  DEPLOY_ROLE_ARN: arn:aws:iam::566252491895:role/daibx-api-prod-deploy
  FUNCTION_URL: https://feezjo6k7aw7kbbtgqhgojacre0menau.lambda-url.ap-southeast-1.on.aws/
  SQLX_CLI_VERSION: 0.9.0

jobs:
  deploy:
    name: Migrate, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99"
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install cargo-lambda
        run: pip install cargo-lambda==1.9.2

      - name: Cache sqlx-cli
        id: sqlx-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}-${{ runner.os }}

      - name: Install sqlx-cli
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli@${{ env.SQLX_CLI_VERSION }} --locked --no-default-features --features postgres,rustls

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -d migrations ]; then
            source ops/verified-database-url.sh
            DATABASE_URL="$(verified_database_url "$DATABASE_URL")" sqlx migrate run
          else
            echo "No migrations yet"
          fi

      - name: Build
        env:
          SQLX_OFFLINE: "true"
        run: cargo lambda build --release --arm64 --output-format zip --bin daibx-api --bin daibx-scheduler

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://target/lambda/daibx-api/bootstrap.zip \
            --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          aws lambda update-function-code \
            --function-name "$SCHEDULER_FUNCTION_NAME" \
            --zip-file fileb://target/lambda/daibx-scheduler/bootstrap.zip \
            --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$SCHEDULER_FUNCTION_NAME"

      - name: Check health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 2 "${FUNCTION_URL}health"

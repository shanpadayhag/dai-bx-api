name: Warm the release cache

on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - build.rs
      - .github/workflows/warm-release-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-release-cache
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the Lambda release into the master cache
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99"
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lambda-arm64-release

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install cargo-lambda
        run: pip install cargo-lambda==1.9.2

      - name: Build
        env:
          SQLX_OFFLINE: "true"
        run: cargo lambda build --release --arm64 --output-format zip --bin daibx-api --bin daibx-scheduler

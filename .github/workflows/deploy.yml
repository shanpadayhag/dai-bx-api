name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      function-url:
        description: The API function URL, ending in a slash
        required: true
        type: string
    secrets:
      DATABASE_URL:
        required: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  FUNCTION_NAME: daibx-api-${{ inputs.environment }}
  SCHEDULER_FUNCTION_NAME: daibx-scheduler-${{ inputs.environment }}
  DEPLOY_ROLE_ARN: arn:aws:iam::566252491895:role/daibx-api-${{ inputs.environment }}-deploy
  FUNCTION_URL: ${{ inputs.function-url }}
  SQLX_CLI_VERSION: 0.9.0

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache sqlx-cli
        id: sqlx-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}-${{ runner.os }}

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        with:
          toolchain: "1.99"

      - name: Install sqlx-cli
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli@${{ env.SQLX_CLI_VERSION }} --locked --no-default-features --features postgres,rustls

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source ops/verified-database-url.sh
          DATABASE_URL="$(verified_database_url "$DATABASE_URL")" sqlx migrate run

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daibx-lambdas
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://dist/daibx-api/bootstrap.zip \
            --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          aws lambda update-function-code \
            --function-name "$SCHEDULER_FUNCTION_NAME" \
            --zip-file fileb://dist/daibx-scheduler/bootstrap.zip \
            --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$SCHEDULER_FUNCTION_NAME"

      - name: Check health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 2 "${FUNCTION_URL}health"
